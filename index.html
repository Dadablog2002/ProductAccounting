<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облік товарів</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0e0e0;
            --text-color: #333;
            --container-bg: white;
            --button-bg: #4a90e2;
            --button-hover-bg: #357abd;
            --table-header-bg: #e9eff5;
            --table-border-color: #ddd;
            --table-footer-bg: #fafafa;
            --theme-button-text: white;
            --theme-button-bg: #4a90e2;
        }
        .dark-theme {
            --bg-color: #333;
            --text-color: #f2f2f2;
            --container-bg: #444;
            --button-bg: #64b5f6;
            --button-hover-bg: #42a5f5;
            --table-header-bg: #555;
            --table-border-color: #666;
            --table-footer-bg: #555;
            --theme-button-text: #333;
            --theme-button-bg: #f0f0f0;
        }
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: var(--container-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: background 0.3s, box-shadow 0.3s;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .controls input[type="text"],
        .controls input[type="number"],
        .controls input[type="file"] {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            min-width: 140px;
            background: var(--container-bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: var(--button-bg);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .controls button:hover {
            background: var(--button-hover-bg);
        }
        .controls button:last-child {
            color: var(--theme-button-text);
            background: var(--theme-button-bg);
            border: 1px solid var(--button-bg);
        }
        .dark-theme .controls button:last-child {
            color: var(--theme-button-text);
            background: var(--theme-button-bg);
            border: 1px solid var(--button-bg);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid var(--table-border-color);
            transition: border-color 0.3s;
        }
        th {
            background: var(--table-header-bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        tbody tr {
            transition: background-color 0.3s;
        }
        tbody tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .dark-theme tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.05);
        }
        tfoot td {
            font-weight: bold;
            background: var(--table-footer-bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Облік товарів</h1>

        <div class="controls">
            <input type="text" id="name" placeholder="Назва товару">
            <input type="number" id="price" placeholder="Ціна">
            <input type="number" id="quantity" placeholder="Кількість">
            <button onclick="addItem()">Додати</button>
            <input type="file" accept=".xlsx" onchange="handleFileUpload(event)">
            <button onclick="downloadPDF()">Зберегти в PDF</button>
            <button onclick="downloadExcel()">Експорт в Excel</button>
            <button onclick="toggleTheme()">Темна тема</button>
        </div>

        <table id="myTable">
            <thead>
                <tr>
                    <th>Назва товару</th>
                    <th>Ціна</th>
                    <th>Кількість</th>
                    <th>Сума</th>
                    <th>Дія</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Загальна сума</td>
                    <td colspan="2" id="totalSum">0.00 грн</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        let items = JSON.parse(localStorage.getItem("items")) || [];
        let isDarkMode = localStorage.getItem("darkMode") === "true" || false;
        const themeButton = document.querySelector('.controls button:last-child');

        function updateTheme() {
            document.body.classList.toggle('dark-theme', isDarkMode);
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            themeButton.textContent = isDarkMode ? "Світла тема" : "Темна тема";
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem("darkMode", isDarkMode);
            updateTheme();
        }

        function renderTable() {
            const body = document.getElementById("tableBody");
            const totalSumEl = document.getElementById("totalSum");
            body.innerHTML = "";
            let total = 0;

            items.forEach((item, index) => {
                const sum = item.price * item.quantity;
                total += sum;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.price.toFixed(2)}</td>
                    <td>${item.quantity}</td>
                    <td>${sum.toFixed(2)}</td>
                    <td><button onclick="deleteItem(${index})">❌</button></td>
                `;
                body.appendChild(row);
            });

            totalSumEl.textContent = total.toFixed(2) + " грн";
            localStorage.setItem("items", JSON.stringify(items));
        }

        function addItem() {
            const name = document.getElementById("name").value.trim();
            const price = parseFloat(document.getElementById("price").value);
            const quantity = parseInt(document.getElementById("quantity").value);

            if (!name || isNaN(price) || isNaN(quantity)) {
                alert("Будь ласка, заповніть усі поля правильно.");
                return;
            }

            items.push({ name, price, quantity });
            renderTable();

            document.getElementById("name").value = "";
            document.getElementById("price").value = "";
            document.getElementById("quantity").value = "";
        }

        function deleteItem(index) {
            items.splice(index, 1);
            renderTable();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: "array" });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);

                rows.forEach(row => {
                    const name = row["Назва товару"];
                    const price = parseFloat(row["Ціна"]);
                    const quantity = parseInt(row["Кількість"]);
                    if (name && !isNaN(price) && !isNaN(quantity)) {
                        items.push({ name, price, quantity });
                    }
                });

                renderTable();
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadPDF() {
            const element = document.getElementById("myTable");
            const opt = {
                margin: 0.5,
                filename: 'облік-товарів.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        function downloadExcel() {
            const wb = XLSX.utils.book_new();
            const wsData = [
                ["Назва товару", "Ціна", "Кількість", "Сума"],
                ...items.map(item => [item.name, item.price, item.quantity, (item.price * item.quantity).toFixed(2)]),
                ["", "", "Загальна сума", document.getElementById("totalSum").textContent.replace(" грн", "")]
            ];
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Товари");
            XLSX.writeFile(wb, 'облік-товарів.xlsx');
        }

        updateTheme();
        renderTable();
    </script>
</body>
</html>
